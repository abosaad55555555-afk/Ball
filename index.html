<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Football Bridge - Realistic Jewels & Coins Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    user-select: none;
  }
  #gameCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  #hud.visible { opacity: 1; }
  .hud-panel {
    background: rgba(10, 15, 25, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 12px 18px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .hud-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
  }
  .hud-item + .hud-item { margin-top: 6px; }
  .hud-value { color: #ffd54a; font-weight: 800; text-shadow: 0 0 10px rgba(255,213,74,0.5); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at center, rgba(15,23,42,0.92) 0%, rgba(2,6,23,0.98) 100%);
    backdrop-filter: blur(20px);
    z-index: 100; padding: 20px;
  }
  .overlay.hidden { display: none !important; }
  .overlay-content { max-width: 440px; width: 100%; text-align: center; }

  .logo {
    font-size: clamp(38px, 10vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #ffd54a 0%, #38bdf8 50%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px; line-height: 1.1;
  }
  .logo-sub {
    font-size: 13px; color: #38bdf8;
    letter-spacing: 5px; text-transform: uppercase;
    margin-bottom: 20px; font-weight: 700;
  }

  .currency-bar {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 16px;
  }
  .currency-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px; padding: 8px 18px;
    font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px;
  }

  .scene-container { margin-bottom: 16px; text-align: center; }
  .scene-label { font-size: 11px; letter-spacing: 3px; color: #38bdf8; margin-bottom: 8px; font-weight: 800; text-transform: uppercase; }
  .scene-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .scene-btn {
    padding: 10px 4px; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; color: #94a3b8; cursor: pointer;
  }
  .scene-btn.active {
    background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
    color: #fff; border-color: #38bdf8;
  }

  .difficulty-container { margin-bottom: 20px; text-align: center; }
  .difficulty-label { font-size: 11px; letter-spacing: 3px; color: #ffd54a; margin-bottom: 8px; font-weight: 800; text-transform: uppercase; }
  .difficulty-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .diff-btn {
    padding: 10px 4px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; color: #94a3b8; cursor: pointer;
  }
  .diff-btn.active {
    background: linear-gradient(135deg, #ffd54a 0%, #f97316 100%);
    color: #0f172a; border-color: #ffd54a;
  }

  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .btn {
    padding: 16px 24px; font-size: 16px; font-weight: 800;
    border: none; border-radius: 14px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; font-family: inherit;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #ffd54a 0%, #f97316 100%);
    color: #0f172a; grid-column: span 2;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .touch-zones {
    position: absolute; bottom: 40px; left: 0; right: 0;
    display: none; justify-content: space-between; padding: 0 40px; z-index: 5; opacity: 0.35; pointer-events: none;
  }
  .touch-zone {
    width: 80px; height: 80px; background: rgba(255,255,255,0.1);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 32px; border: 2px solid rgba(255,255,255,0.25);
  }
  .touch-zone.active { background: rgba(255,213,74,0.4); border-color: #ffd54a; opacity: 1; transform: scale(1.1); }
  @media (hover: none) and (pointer: coarse) { .touch-zones { display: flex; } }

  .shake { animation: shake 0.4s ease-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-10px, -5px); }
    40% { transform: translate(10px, 5px); }
    60% { transform: translate(-6px, 3px); }
    80% { transform: translate(6px, -3px); }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="hud-panel">
    <div class="hud-item">🏆 <span>Level</span> <span class="hud-value" id="levelDisplay">1</span></div>
    <div class="hud-item">📏 <span class="hud-value" id="distDisplay">0m</span></div>
  </div>
  <div class="hud-panel">
    <div class="hud-item">💎 <span class="hud-value" id="coinDisplay">0</span></div>
  </div>
</div>

<div class="touch-zones" id="touchZones">
  <div class="touch-zone" id="leftZone">←</div>
  <div class="touch-zone" id="rightZone">→</div>
</div>

<!-- MENU -->
<div class="overlay" id="menuScreen">
  <div class="overlay-content">
    <h1 class="logo">Football<br>Bridge</h1>
    <div class="logo-sub">Jewels & Coins Edition</div>

    <div class="currency-bar">
      <div class="currency-item">💎 <span id="menuCoins">0</span></div>
      <div class="currency-item">⭐ <span id="menuBest">0m</span></div>
    </div>

    <div class="scene-container">
      <div class="scene-label">Select 3D World</div>
      <div class="scene-grid">
        <button class="scene-btn active" data-scene="ocean">🌊 Ocean</button>
        <button class="scene-btn" data-scene="cyber">🌆 Cyberpunk</button>
        <button class="scene-btn" data-scene="forest">🌲 Mystic Forest</button>
      </div>
    </div>

    <div class="difficulty-container">
      <div class="difficulty-label">Select Difficulty</div>
      <div class="difficulty-grid">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="normal">Normal</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
        <button class="diff-btn" data-diff="expert">Expert</button>
      </div>
    </div>

    <div class="menu-grid">
      <button class="btn btn-primary" id="playBtn">▶ Start Match</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="overlay hidden" id="gameOverScreen">
  <div class="overlay-content">
    <h1 style="font-size: 42px; font-weight: 900; color: #ef4444; margin-bottom: 10px;">Full Time!</h1>
    <p id="finalDist" style="font-size: 28px; font-weight: 800; color: #ffd54a; margin-bottom: 20px;">0m</p>
    <div class="menu-grid">
      <button class="btn btn-primary" id="restartBtn">🔄 Play Again</button>
      <button class="btn btn-secondary" id="menuBtn" style="grid-column: span 2;">🏠 Main Menu</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const SAVE_KEY = 'footballBridge_jewels_v1';
  let save = JSON.parse(localStorage.getItem(SAVE_KEY)) || { coins: 0, best: 0 };
  function saveSave() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

  let selectedScene = 'ocean';
  let selectedDifficulty = 'normal';

  const DIFFICULTIES = {
    easy: { speed: 6, minW: 3.0, maxW: 5.5, moveChance: 0.05 },
    normal: { speed: 8, minW: 2.2, maxW: 4.5, moveChance: 0.15 },
    hard: { speed: 10, minW: 1.7, maxW: 3.5, moveChance: 0.3 },
    expert: { speed: 12, minW: 1.3, maxW: 2.8, moveChance: 0.45 }
  };

  class AudioSystem {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, duration, type = 'sine', vol = 0.1) {
      if (!this.ctx) return;
      try {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + duration);
      } catch(e) {}
    }
  }
  const audio = new AudioSystem();

  const canvas = document.getElementById('gameCanvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
  sunLight.position.set(30, 60, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 150;
  sunLight.shadow.camera.left = -25;
  sunLight.shadow.camera.right = 25;
  sunLight.shadow.camera.top = 25;
  sunLight.shadow.camera.bottom = -25;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);

  let envGroup = new THREE.Group();
  scene.add(envGroup);

  function buildEnvironment(type) {
    while(envGroup.children.length > 0) envGroup.remove(envGroup.children[0]);
    
    if (type === 'ocean') {
      scene.background = new THREE.Color(0x0c192c);
      scene.fog = new THREE.FogExp2(0x0c192c, 0.012);
      ambientLight.color.setHex(0x38bdf8);
      sunLight.color.setHex(0xfffbeb);

      const waterGeo = new THREE.PlaneGeometry(3000, 3000, 32, 32);
      const waterMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, flatShading: true });
      const water = new THREE.Mesh(waterGeo, waterMat);
      water.rotation.x = -Math.PI / 2;
      water.position.y = -25;
      water.receiveShadow = true;
      envGroup.add(water);

    } else if (type === 'cyber') {
      scene.background = new THREE.Color(0x050510);
      scene.fog = new THREE.FogExp2(0x050510, 0.015);
      ambientLight.color.setHex(0xa855f7);
      sunLight.color.setHex(0x38bdf8);

      const grid = new THREE.GridHelper(3000, 100, 0xff007f, 0x3b82f6);
      grid.position.y = -25;
      envGroup.add(grid);

      for (let i = 0; i < 40; i++) {
        const h = 40 + Math.random() * 80;
        const bldg = new THREE.Mesh(
          new THREE.BoxGeometry(15 + Math.random() * 15, h, 15 + Math.random() * 15),
          new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2, emissive: 0x1f2937 })
        );
        const side = Math.random() > 0.5 ? 1 : -1;
        bldg.position.set(side * (30 + Math.random() * 80), h/2 - 25, (Math.random() - 0.5) * 1000);
        envGroup.add(bldg);
      }

    } else if (type === 'forest') {
      scene.background = new THREE.Color(0x064e3b);
      scene.fog = new THREE.FogExp2(0x064e3b, 0.018);
      ambientLight.color.setHex(0x34d399);
      sunLight.color.setHex(0xfef08a);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(3000, 3000),
        new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -25;
      envGroup.add(ground);

      for (let i = 0; i < 60; i++) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
        trunk.position.y = -21;
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(5, 14, 5), new THREE.MeshStandardMaterial({ color: 0x047857 }));
        leaves.position.y = -13;
        tree.add(trunk, leaves);
        
        const side = Math.random() > 0.5 ? 1 : -1;
        tree.position.set(side * (15 + Math.random() * 60), 0, (Math.random() - 0.5) * 1000);
        envGroup.add(tree);
      }
    }
  }

  function createRealisticBallTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, 1024, 512);

    ctx.fillStyle = '#0f172a';
    const cw = 128, ch = 128;
    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 9; x++) {
        ctx.beginPath();
        let px = x * cw + (y % 2 ? cw / 2 : 0);
        let py = y * ch;
        for (let i = 0; i < 6; i++) {
          let angle = (i * Math.PI) / 3;
          let hx = px + 40 * Math.cos(angle);
          let hy = py + 40 * Math.sin(angle);
          if (i === 0) ctx.moveTo(hx, hy);
          else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  const ballGeo = new THREE.SphereGeometry(0.6, 64, 64);
  const ballMat = new THREE.MeshStandardMaterial({ map: createRealisticBallTexture(), roughness: 0.4, metalness: 0.1 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.castShadow = true;
  scene.add(ball);

  const shadowGeo = new THREE.PlaneGeometry(1.2, 1.2);
  const sCanvas = document.createElement('canvas'); sCanvas.width = 64; sCanvas.height = 64;
  const sCtx = sCanvas.getContext('2d');
  const grad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(0,0,0,0.8)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  sCtx.fillStyle = grad; sCtx.fillRect(0,0,64,64);
  const ballShadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sCanvas), transparent: true }));
  ballShadow.rotation.x = -Math.PI / 2;
  scene.add(ballShadow);

  const trailPoints = [];
  const trailGeo = new THREE.BufferGeometry();
  const trailMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });
  const trailLine = new THREE.Line(trailGeo, trailMat);
  scene.add(trailLine);

  let activeParticles = [];
  function spawnSparkles(pos, color) {
    for (let i = 0; i < 15; i++) {
      const pMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: color || 0xfacc15, transparent: true })
      );
      pMesh.position.copy(pos);
      scene.add(pMesh);
      activeParticles.push({
        mesh: pMesh,
        vel: new THREE.Vector3((Math.random()-0.5)*6, Math.random()*6 + 2, (Math.random()-0.5)*6),
        life: 0.6
      });
    }
  }

  const bridgeGroup = new THREE.Group();
  scene.add(bridgeGroup);

  let segments = [], collectibles = [], nextZ = 0;
  const plankMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7, metalness: 0.2 });
  const railMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3, metalness: 0.5 });

  // مواد العملات والمجوهرات المختلفة
  const itemMaterials = {
    coin: new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.6, metalness: 0.9, roughness: 0.1 }),
    diamond: new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8, metalness: 0.3, roughness: 0.0, transparent: true, opacity: 0.85 }),
    ruby: new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xb91c1c, emissiveIntensity: 0.8, metalness: 0.3, roughness: 0.1 })
  };

  function createSegment(opts) {
    const width = opts.width || 3;
    const length = opts.length || 3;

    const plank = new THREE.Mesh(new THREE.BoxGeometry(width, 0.4, length), plankMat);
    plank.position.set(opts.x || 0, 0, nextZ + length / 2);
    plank.castShadow = true; plank.receiveShadow = true;
    bridgeGroup.add(plank);

    const railGeo = new THREE.BoxGeometry(0.15, 0.8, length);
    const railL = new THREE.Mesh(railGeo, railMat);
    railL.position.set(-width / 2, 0.5, nextZ + length / 2);
    bridgeGroup.add(railL);

    const railR = new THREE.Mesh(railGeo, railMat);
    railR.position.set(width / 2, 0.5, nextZ + length / 2);
    bridgeGroup.add(railR);

    segments.push({
      plank, zStart: nextZ, zEnd: nextZ + length, width,
      moving: opts.moving || false, basePer: Math.random() * Math.PI * 2, speed: 1.5
    });
    nextZ += length;

    // إضافة عملات أو مجوهرات عشوائية بنسبة 45%
    if (Math.random() < 0.45) {
      const randType = Math.random();
      let geom, type, val, color;
      if (randType < 0.6) {
        geom = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 32); // عملة ذهبية
        type = 'coin'; val = 1; color = 0xfacc15;
      } else if (randType < 0.85) {
        geom = new THREE.OctahedronGeometry(0.4); // ماسة زرقاء
        type = 'diamond'; val = 3; color = 0x38bdf8;
      } else {
        geom = new THREE.DodecahedronGeometry(0.35); // ياقوتة حمراء
        type = 'ruby'; val = 5; color = 0xef4444;
      }

      const itemMesh = new THREE.Mesh(geom, itemMaterials[type]);
      if (type === 'coin') itemMesh.rotation.x = Math.PI / 2;
      itemMesh.position.set((opts.x || 0), 1.2, nextZ - length / 2);
      bridgeGroup.add(itemMesh);
      collectibles.push({ mesh: itemMesh, value: val, color: color, collected: false });
    }
  }

  function generateLevel(lvl) {
    while(bridgeGroup.children.length > 0) bridgeGroup.remove(bridgeGroup.children[0]);
    segments = []; collectibles = []; nextZ = 0;
    createSegment({ width: 5, length: 6 });

    const diff = DIFFICULTIES[selectedDifficulty];
    while (nextZ < 250 + lvl * 60) {
      const w = Math.max(diff.minW, diff.maxW - (lvl * 0.08));
      createSegment({ width: w, length: 3, moving: Math.random() < diff.moveChance, x: (Math.random()-0.5)*2 });
    }
    return nextZ;
  }

  const state = { running: false, speed: 8, level: 1, dist: 0, coins: 0, latVel: 0, falling: false, fallVel: 0, time: 0 };
  const keys = {};
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  let touchLeft = false, touchRight = false;
  window.addEventListener('touchstart', e => {
    if (!state.running) return;
    touchLeft = e.touches[0].clientX < window.innerWidth / 2;
    touchRight = !touchLeft;
  });
  window.addEventListener('touchend', () => { touchLeft = false; touchRight = false; });

  function startGame() {
    audio.init();
    buildEnvironment(selectedScene);
    const diff = DIFFICULTIES[selectedDifficulty];
    state.running = true;
    state.speed = diff.speed;
    state.level = 1;
    state.dist = 0;
    state.coins = 0;
    state.latVel = 0;
    state.falling = false;
    state.fallVel = 0;

    ball.position.set(0, 0.75, 3);
    ball.rotation.set(0, 0, 0);
    generateLevel(1);

    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('hud').classList.add('visible');
  }

  function gameOver() {
    state.running = false;
    if (state.dist > save.best) save.best = Math.floor(state.dist);
    save.coins += state.coins;
    saveSave();

    document.getElementById('finalDist').textContent = Math.floor(state.dist) + 'm (Total Gems: ' + state.coins + ')';
    document.getElementById('hud').classList.remove('visible');
    document.getElementById('gameOverScreen').classList.remove('hidden');
    canvas.classList.add('shake');
    setTimeout(() => canvas.classList.remove('shake'), 400);
  }

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.onclick = e => {
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedScene = e.target.getAttribute('data-scene');
      buildEnvironment(selectedScene);
    };
  });

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.onclick = e => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedDifficulty = e.target.getAttribute('data-diff');
    };
  });

  document.getElementById('playBtn').onclick = startGame;
  document.getElementById('restartBtn').onclick = startGame;
  document.getElementById('menuBtn').onclick = () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('menuScreen').classList.remove('hidden');
    document.getElementById('menuCoins').textContent = save.coins;
    document.getElementById('menuBest').textContent = save.best + 'm';
    buildEnvironment(selectedScene);
  };

  buildEnvironment(selectedScene);
  document.getElementById('menuCoins').textContent = save.coins;
  document.getElementById('menuBest').textContent = save.best + 'm';

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    state.time += dt;

    if (envGroup.children[0] && selectedScene === 'ocean') {
      envGroup.children[0].position.z = ball.position.z;
    }

    for (let i = activeParticles.length - 1; i >= 0; i--) {
      let p = activeParticles[i];
      p.life -= dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.material.opacity = p.life / 0.6;
      if (p.life <= 0) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        activeParticles.splice(i, 1);
      }
    }

    if (state.running) {
      let input = 0;
      if (keys['a'] || keys['arrowleft'] || touchLeft) input -= 1;
      if (keys['d'] || keys['arrowright'] || touchRight) input += 1;

      if (!state.falling) {
        state.latVel += (input * 14 - state.latVel) * 10 * dt;
        ball.position.z += state.speed * dt;
        ball.position.x += state.latVel * dt;
        ball.rotation.x -= state.speed * dt / 0.6;
        ball.rotation.z -= state.latVel * dt / 0.6;

        ballShadow.position.x = ball.position.x;
        ballShadow.position.z = ball.position.z;

        trailPoints.push(ball.position.clone());
        if (trailPoints.length > 20) trailPoints.shift();
        trailGeo.setFromPoints(trailPoints);

        segments.forEach(seg => {
          if (seg.moving) {
            seg.plank.position.x = Math.sin(state.time * seg.speed + seg.basePer) * 1.5;
          }
        });

        collectibles.forEach(item => {
          item.mesh.rotation.y += dt * 3;
          if (!item.collected && ball.position.distanceTo(item.mesh.position) < 1.1) {
            item.collected = true;
            bridgeGroup.remove(item.mesh);
            state.coins += item.value;
            audio.tone(900 + item.value * 50, 0.08);
            spawnSparkles(item.mesh.position, item.color);
            document.getElementById('coinDisplay').textContent = state.coins;
          }
        });

        let onBridge = false;
        for (const seg of segments) {
          if (ball.position.z >= seg.zStart && ball.position.z <= seg.zEnd) {
            if (Math.abs(ball.position.x - seg.plank.position.x) <= seg.width / 2 - 0.35) {
              onBridge = true;
              ball.position.y = 0.75;
            }
            break;
          }
        }

        if (!onBridge) {
          state.falling = true;
          state.fallVel = 2;
          ballShadow.visible = false;
          audio.tone(200, 0.3, 'sawtooth');
        }

        state.dist = ball.position.z - 3;
        document.getElementById('distDisplay').textContent = Math.floor(state.dist) + 'm';
      } else {
        ball.position.y -= state.fallVel * dt;
        state.fallVel += 18 * dt;
        if (ball.position.y < -22) gameOver();
      }
    }

    camera.position.x += (ball.position.x * 0.5 - camera.position.x) * 6 * dt;
    camera.position.y += ((ball.position.y + 3.8) - camera.position.y) * 6 * dt;
    camera.position.z += ((ball.position.z - 6.5) - camera.position.z) * 6 * dt;
    camera.lookAt(ball.position.x, ball.position.y, ball.position.z + 2);

    renderer.render(scene, camera);
  }
  animate();
});
</script>
</body>
</html>
